# Base de datos del proyecto.
# Levantar con:  docker compose up -d
# Detener con:   docker compose down
services:
  db:
    image: postgres:16-alpine
    container_name: finanzas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas
      POSTGRES_DB: finanzas
    ports:
      - "5433:5432"   # 5433 en el host para no chocar con un Postgres ya instalado
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
